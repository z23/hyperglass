name: Backend Testing
on:
    push:
        paths:
            - hyperglass/**
            - .github/**
    pull_request:

jobs:
    backend:
        name: Backend Tests
        strategy:
            fail-fast: false
            matrix:
                node-version: [20.x]
                pnpm-version: [9]
                python-version: ["3.11", "3.12"]
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}

        steps:
            - name: Git Checkout
              uses: actions/checkout@v3

            - name: Install system pachages
              run: |
                    sudo apt-get update
                    sudo apt-get install -y libcairo2-dev pkg-config python3-dev

            - name: Install Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Setup Rye
              uses: sksat/setup-rye@v0.23.1

            - name: Install Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install PNPM
              uses: pnpm/action-setup@v3
              with:
                  version: ${{ matrix.pnpm-version }}

            # Installed from the distribution rather than run as a container: the
            # rate-limit integration tests start their own isolated `redis-server`
            # process, so the binary has to be on PATH. The packaged service also
            # provides the instance on localhost:6379 that the rest of the suite uses.
            - name: Install and start Redis
              run: |
                    sudo apt-get install -y redis-server
                    sudo systemctl start redis-server
                    redis-server --version
                    redis-cli ping

            - name: Prepare
              run: |
                  mkdir -p "$HOME/hyperglass"
                  echo "HYPERGLASS_APP_PATH=$HOME/hyperglass" >> $GITHUB_ENV
                  echo "HYPERGLASS_HOST=127.0.0.1" >> $GITHUB_ENV
                  echo "HYPERGLASS_PORT=8001" >> $GITHUB_ENV

            - name: Install
              run: rye sync

            - name: Activate virtualenv
              run: |
                  . .venv/bin/activate
                  echo PATH=$PATH >> $GITHUB_ENV

            - name: Lint (Rye)
              run: rye lint

            - name: Tests (PyTest)
              run: pytest hyperglass --ignore hyperglass/plugins/external

            - name: Run hyperglass
              run: ".tests/ga-backend-app.sh"
