name: Docker Image
on:
    push:
        paths:
            - Dockerfile
            - compose.yaml
            - .dockerignore
            - pyproject.toml
            - requirements.lock
            - hyperglass/**
            - .github/workflows/docker.yml
    pull_request:

jobs:
    image:
        name: Build and Start Image
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            HYPERGLASS_APP_PATH: ${{ github.workspace }}/.ci-app

        steps:
            - name: Git Checkout
              uses: actions/checkout@v4

            - name: Build image
              run: docker compose build

            - name: Report toolchain versions
              run: |
                  docker compose run --rm --no-deps --entrypoint sh hyperglass -c \
                      'cat /etc/alpine-release; python3 --version; node --version; pnpm --version; pip3 check'

            - name: Prepare configuration
              run: |
                  mkdir -p "$HYPERGLASS_APP_PATH"
                  cp .tests/devices.yaml .tests/directives.yaml "$HYPERGLASS_APP_PATH/"

            - name: Start hyperglass
              run: docker compose up -d

            # The UI is built when the container starts, so the first response
            # can take several minutes.
            - name: Wait for the UI
              run: |
                  for attempt in $(seq 1 120); do
                      status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/ || true)
                      if [ "$status" = "200" ]; then
                          echo "UI answered after $attempt attempts"
                          exit 0
                      fi
                      if [ -z "$(docker compose ps -q --status running hyperglass)" ]; then
                          echo "hyperglass container is not running"
                          exit 1
                      fi
                      sleep 5
                  done
                  echo "UI did not answer in time (last status: $status)"
                  exit 1

            - name: Check the API
              run: |
                  set -e
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/api/info)" = "200"
                  curl -s http://127.0.0.1:8001/api/devices | grep -q '"example_device"'
                  status=$(curl -s -o /tmp/invalid.json -w '%{http_code}' \
                      -H 'content-type: application/json' \
                      -d '{"queryLocation":"example_device","queryType":"juniper_bgp_route","queryTarget":"1.1.1.0/24;reboot"}' \
                      http://127.0.0.1:8001/api/query)
                  cat /tmp/invalid.json
                  test "$status" = "400"

            - name: Container logs
              if: always()
              run: docker compose logs --no-color --tail 200

            - name: Stop
              if: always()
              run: docker compose down
