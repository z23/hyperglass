services:
    redis:
        image: "redis:alpine"
    hyperglass:
        depends_on:
            - redis
        environment:
            - HYPERGLASS_APP_PATH=/etc/hyperglass
            - HYPERGLASS_HOST=${HYPERGLASS_HOST-0.0.0.0}
            - HYPERGLASS_PORT=${HYPERGLASS_PORT-8001}
            - HYPERGLASS_DEBUG=${HYPERGLASS_DEBUG-false}
            - HYPERGLASS_DEV_MODE=${HYPERGLASS_DEV_MODE-false}
            - HYPERGLASS_REDIS_HOST=${HYPERGLASS_REDIS_HOST-redis}
            - HYPERGLASS_DISABLE_UI=${HYPERGLASS_DISABLE_UI-false}
            - HYPERGLASS_CONTAINER=${HYPERGLASS_CONTAINER-true}
            # Per-client rate limit for the unauthenticated /api/query endpoint.
            - HYPERGLASS_RATE_LIMIT=${HYPERGLASS_RATE_LIMIT-10}
            - HYPERGLASS_RATE_LIMIT_PERIOD=${HYPERGLASS_RATE_LIMIT_PERIOD-minute}
            - HYPERGLASS_RATE_LIMIT_ENABLE=${HYPERGLASS_RATE_LIMIT_ENABLE-true}
            # Set this to the proxy peer as seen inside the container, not the
            # host's published-port address. See the reverse-proxy guide.
            # Preserve Uvicorn's default; an explicit empty value trusts no proxy.
            - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS-127.0.0.1}
            - HYPERGLASS_ORIGINAL_APP_PATH=${HYPERGLASS_APP_PATH}
        build: .
        # Bind to loopback only — put Caddy/NGINX (or another reverse proxy) in
        # front for public HTTPS. Keep untrusted clients off the app port and
        # configure proxy trust explicitly; see docs/installation/reverse-proxy.
        ports:
            - "127.0.0.1:${HYPERGLASS_PORT-8001}:${HYPERGLASS_PORT-8001}"
        volumes:
            - ${HYPERGLASS_APP_PATH-/etc/hyperglass}:/etc/hyperglass
